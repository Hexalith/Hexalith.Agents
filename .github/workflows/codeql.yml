name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '31 3 * * 1'

concurrency:
  group: codeql-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  codeql:
    uses: Hexalith/Hexalith.Builds/.github/workflows/codeql.yml@9f85d8e66e5c16675cee8c224f1fd88430d96007
    permissions:
      security-events: write
      contents: read
    with:
      languages: csharp,javascript-typescript
