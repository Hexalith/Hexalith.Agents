name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  ci:
    uses: Hexalith/Hexalith.Builds/.github/workflows/domain-ci.yml@cb91511794c8898b738d85dc6c751f82b832cbc9
    with:
      solution: Hexalith.Agents.slnx
      test-platform: microsoft-testing-platform
      run-consumer-validation: true
      unit-test-projects: |
        test/Hexalith.Agents.Contracts.Tests
        test/Hexalith.Agents.Client.Tests
        test/Hexalith.Agents.Tests
        test/Hexalith.Agents.Server.Tests
        test/Hexalith.Agents.UI.Tests

  agents-policy:
    name: Agents package and tooling policy
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          submodules: false
      - name: Initialize root-declared submodules
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t paths < <(git config -f .gitmodules --get-regexp path | awk '{print $2}')
          git -c submodule.recurse=false submodule update --init -- "${paths[@]}"
      - uses: actions/setup-dotnet@v6.0.0
        with:
          global-json-file: global.json
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: '24'
      - name: Install locked JavaScript tooling
        run: npm ci --ignore-scripts
      - name: Enforce shared package authority
        shell: pwsh
        run: ./references/Hexalith.Builds/Tools/validate-consumer-package-authority.ps1 -RepositoryRoot . -CatalogPath ./references/Hexalith.Builds/Props/Directory.Packages.props
      - name: Enforce EventStore package floor
        shell: pwsh
        run: ./eng/verify-story-5.2.ps1 -PackageFloorOnly
      - name: Run tooling contract tests
        run: python3 -m unittest discover -s tests/tooling -p '*_test.py'
