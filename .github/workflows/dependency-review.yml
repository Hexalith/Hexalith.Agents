name: Dependency Review

on:
  pull_request:
    branches: [main]

concurrency:
  group: dependency-review-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  dependency-review:
    permissions:
      contents: read
      pull-requests: write
    uses: Hexalith/Hexalith.Builds/.github/workflows/dependency-review.yml@359fee24aeca4d9eabed4b425d4cfa2520b2adda
