name: Dependency Review

on:
  pull_request:
    branches: [main]

concurrency:
  group: dependency-review-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  dependency-review:
    permissions:
      contents: read
      pull-requests: write
    uses: Hexalith/Hexalith.Builds/.github/workflows/dependency-review.yml@4250edc94af021945fe072085f02b5122c9b21c3
