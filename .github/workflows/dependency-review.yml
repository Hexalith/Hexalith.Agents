name: Dependency Review

on:
  pull_request:
    branches: [main]

concurrency:
  group: dependency-review-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  dependency-review:
    permissions:
      contents: read
      pull-requests: write
    uses: Hexalith/Hexalith.Builds/.github/workflows/dependency-review.yml@6ad5854aa14a9950e1fbfc32d7e27953a1c4b82b
