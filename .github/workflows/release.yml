name: Release

on:
  workflow_dispatch:

concurrency:
  group: release-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  verify-source:
    name: Verify exact green main source
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      publish-enabled: ${{ steps.publication-gate.outputs.publish-enabled }}
    permissions:
      actions: read
      contents: read
    steps:
      - name: Apply publication freeze
        id: publication-gate
        shell: bash
        env:
          HEXALITH_RELEASE_PUBLISH_ENABLED: ${{ vars.HEXALITH_RELEASE_PUBLISH_ENABLED }}
        run: |
          set -euo pipefail
          if [ "${HEXALITH_RELEASE_PUBLISH_ENABLED-}" = "true" ]; then
            echo "publish-enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "publish-enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Release publication frozen::HEXALITH_RELEASE_PUBLISH_ENABLED is not exactly the string 'true'; publication and post-publication assertions will be skipped."
            echo "## Release publication frozen" >> "$GITHUB_STEP_SUMMARY"
            echo "No packages were published. Set HEXALITH_RELEASE_PUBLISH_ENABLED to exactly true and dispatch again when publication is intended." >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/checkout@v7.0.1
        if: steps.publication-gate.outputs.publish-enabled == 'true'
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
          submodules: false
      - name: Require the current green main tip
        if: steps.publication-gate.outputs.publish-enabled == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          DISPATCH_REF: ${{ github.ref }}
          DISPATCH_SHA: ${{ github.sha }}
        run: >-
          python3 scripts/verify-release-source.py
          --repository "$REPOSITORY"
          --workflow ci.yml
          --dispatch-ref "$DISPATCH_REF"
          --dispatch-sha "$DISPATCH_SHA"

  plan-release:
    name: Plan exact-source release
    needs: verify-source
    if: needs.verify-source.outputs.publish-enabled == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      release-required: ${{ steps.plan.outputs.release-required }}
      version: ${{ steps.plan.outputs.version }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
          submodules: false
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: '24'
      - name: Install and verify release tooling
        run: |
          npm ci --ignore-scripts
          npm audit signatures
      - name: Compute release decision without side effects
        id: plan
        shell: bash
        run: |
          set -euo pipefail
          node eng/semantic-release-plan.mjs > release-plan.json
          required="$(jq -er '.release_required | if . then "true" else "false" end' release-plan.json)"
          version="$(jq -r '.version // ""' release-plan.json)"
          if [ "$required" = "true" ] && [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([+-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Semantic Release returned a malformed version." >&2
            exit 1
          fi
          echo "release-required=$required" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

  release:
    name: Protected NuGet release
    needs: [verify-source, plan-release]
    if: >-
      always() &&
      needs.verify-source.result == 'success' &&
      needs.verify-source.outputs.publish-enabled == 'true' &&
      needs.plan-release.result == 'success' &&
      needs.plan-release.outputs.release-required == 'true'
    permissions:
      actions: read
      attestations: write
      contents: write
      id-token: write
      issues: write
      pull-requests: write
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: production
    steps:
      - name: Checkout exact dispatched source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
          submodules: false
      - name: Prepare domain release
        id: prepare
        uses: Hexalith/Hexalith.Builds/Github/prepare-domain-release@6ad5854aa14a9950e1fbfc32d7e27953a1c4b82b
        with:
          solution: Hexalith.Agents.slnx
          additional-sdk-version: '10.0.404'
          builds-execution-sha: 6ad5854aa14a9950e1fbfc32d7e27953a1c4b82b
          source-branch: main
          source-ci-workflow: ci.yml
          package-manifest: eng/release-packages.json
          expected-package-count: 6
          publication-flag: ${{ vars.HEXALITH_RELEASE_PUBLISH_ENABLED }}
          nuget-user: ${{ vars.NUGET_TRUSTED_PUBLISHING_USER }}
      - name: Authenticate NuGet trusted publishing
        id: nuget-login
        if: ${{ steps.prepare.outputs.publish-enabled == 'true' }}
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1.2.0
        with:
          user: ${{ vars.NUGET_TRUSTED_PUBLISHING_USER }}
      - name: Semantic Release
        if: ${{ steps.prepare.outputs.publish-enabled == 'true' }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
          NUGET_API_KEY: ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
          HEXALITH_BUILDS_EXECUTION_SHA: 6ad5854aa14a9950e1fbfc32d7e27953a1c4b82b
          HEXALITH_RELEASE_ENVIRONMENT: production
          HEXALITH_RELEASE_SOURCE_BRANCH: main
          HEXALITH_RELEASE_SOURCE_CI_WORKFLOW: ci.yml
          HEXALITH_RELEASE_PACKAGE_MANIFEST: eng/release-packages.json
          HEXALITH_RELEASE_EXPECTED_PACKAGE_COUNT: '6'
          HEXALITH_RELEASE_RESERVED_VERSION: ${{ needs.plan-release.outputs.version }}
          HEXALITH_RELEASE_REQUIRE_AUTHORITY: 'false'
        run: npm exec --no -- semantic-release

  verify-publication:
    name: Verify exact release publication
    needs: [verify-source, plan-release, release]
    if: >-
      always() &&
      needs.verify-source.result == 'success' &&
      needs.verify-source.outputs.publish-enabled == 'true' &&
      needs.plan-release.result == 'success' &&
      needs.plan-release.outputs.release-required == 'true' &&
      needs.release.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
          submodules: false
      - name: Require the GitHub Release and exact six assets at the dispatched SHA
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          DISPATCH_SHA: ${{ github.sha }}
          VERSION: ${{ needs.plan-release.outputs.version }}
        run: |
          set -euo pipefail
          tag="v${VERSION}"
          gh api "repos/${REPOSITORY}/releases/tags/${tag}" > github-release.json
          git fetch --force origin "refs/tags/${tag}:refs/tags/${tag}"
          release_sha="$(git rev-list -n 1 "$tag")"
          python3 scripts/verify-github-release.py \
            eng/release-packages.json github-release.json "$VERSION" "$DISPATCH_SHA" "$release_sha" --metadata-only
          # Bash uses 1024-byte blocks: cap each downloaded file at 64 MiB.
          ulimit -f 65536
          gh release download "$tag" --repo "$REPOSITORY" --dir release-assets
          python3 scripts/verify-github-release.py \
            eng/release-packages.json \
            github-release.json \
            "$VERSION" \
            "$DISPATCH_SHA" \
            "$release_sha" \
            --asset-directory release-assets
      - name: Verify all six versions reached NuGet
        env:
          VERSION: ${{ needs.plan-release.outputs.version }}
        run: python3 scripts/verify-nuget-publication.py eng/release-packages.json "$VERSION" --expect present --package-directory release-assets
